services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/dataforge.db"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AMMP_DATA_API_KEY: "${AMMP_DATA_API_KEY}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    volumes:
      - ./backend:/app/backend
      - ./.data:/data
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://backend:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
