services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/dataforge.db"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    volumes:
      - ./backend:/app/backend
      - appdata:/data
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  appdata:
