[project]
name = "dataforge-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "duckdb>=1.1",
    "httpx>=0.28",
    "python-multipart>=0.0.22",
    "anthropic>=0.40",
    "sqlglot>=28.10.1",
    "sse-starlette>=2.0",
    "pytz>=2025.2",
    "nanoid>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx",
    "ruff>=0.11",
    "mypy>=1.13",
    "types-nanoid>=2.0.0.20240601",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 99

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
